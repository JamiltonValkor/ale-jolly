; Compilar y subir el firmware de los brazos con toolchain nativo (Apple Silicon): pio run -t upload
[platformio]
src_dir = firmware_brazos

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = arduino-libraries/Servo
upload_port = /dev/cu.usbmodem31101
monitor_speed = 115200
platform_packages = platformio/toolchain-atmelavr@3.70300.220127
