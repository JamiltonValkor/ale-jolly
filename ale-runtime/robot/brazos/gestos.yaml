# Qué gestos complementan cada momento de la cara (brazos.py sortea sin repetir los últimos 2 del grupo).
complementos:
  nombre_desde_reposo:    [saludo_corto, saludo_doble, saludo_alto]
  nombre_en_conversacion: [saludo_si, si_dos, hola_mano]
  escucha:        [atenta, atenta_oreja, atenta_inclinada]
  pensando:       [barbilla, manos_juntas, rascar, mirar_mano]
  pensando_largo: [mmm, tamborileo, vaiven_pensar]
  furia: [furia]
  trabajando_tecleando: [teclear, teclear_rafaga]
  trabajando_leyendo:   [teclear, teclear_rafaga, leer, pasar_pagina]
  frase:          [gesticular_abrir, gesticular_enfasis, gesticular_dos, gesticular_golpe, gesticular_ofrecer, gesticular_contar]
  frase_pregunta: [palmas_arriba, encoger_pregunta, barbilla]
  feliz:          [asentir_mano, aplauso, saltito_brazos, feliz_ola]
  orgullosa:      [celebrar_arriba, celebrar_pechito, celebrar_olas]
  preocupada:     [juntos, manos_pecho, calma]
  problema:       [encoger, encoger_doble]
  bostecito:      [estirarse]
  giro_jolly:     [balanceo_giro, giro_amplio]
  reposo:         [reposo]
  vinculado:      [celebrar_vinculo, vinculo_saludo]
