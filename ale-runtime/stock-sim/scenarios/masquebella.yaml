# Escenario con la forma de Masquebella (tienda capilar, COP). Anónimo: las ofertas reales del negocio de prueba se
# resuelven por clave desde un archivo fuera del repo (SIM_OFERTAS), y el negocio desde SIM_NEGOCIO.
nombre: masquebella-forma
semilla: ivb023-v1
moneda: COP
dueno: daniela
ticks_por_dia: 8
hora_primer_tick: 6        # 06:00, luego cada 3 h
historia_semanas: 8
tope_usd: 200

# Topes de la corrida en stock_run_budgets. tokens_ale se fija aquí (IVB-027 llegó a 5,7 M sin fijarlo).
# Día: 8 ticks + ~12 turnos de la dueña, a 136.000 por turno de Ale ≈ 2,7 M; la semana ≈ 7 veces eso.
presupuestos:
  dia:    {tokens_ale: 8000000,  despertares_ale: 16,  tarjetas_stock: 30,  sam_llamadas: 40, extraccion: 4, avisos_voz: 8}
  semana: {tokens_ale: 45000000, despertares_ale: 100, tarjetas_stock: 160, sam_llamadas: 160, extraccion: 10, avisos_voz: 40}

productos:
  # Saldos distintos a la corrida del 2-nov (mañana): una respuesta de memoria con «dieciséis» o «cinco y cinco» queda a la vista.
  - {key: mascarilla, nombre: "Bio Mascarilla Capilar", variante: "500 g", oferta: mascarilla, ritmo_semana: 9, stock_inicial: 16, historia: sano}
  - {key: shampoo_rep, nombre: "Shampoo Capilar 400 ml", variante: "Reparador", oferta: shampoo, ritmo_semana: 4, stock_inicial: 6, historia: sano}
  - {key: shampoo_hid, nombre: "Shampoo Capilar 400 ml", variante: "Hidratante", oferta: shampoo, ritmo_semana: 4, stock_inicial: 4, historia: sano}
  - {key: tonico, nombre: "Tónico Capilar", variante: "120 ml", oferta: tonico, ritmo_semana: 6, stock_inicial: 4, historia: sano}
  - {key: serum, nombre: "Sérum Capilar", variante: "30 ml", oferta: serum, ritmo_semana: 5, stock_inicial: 12, historia: sano, semana_sim: cero}
  - {key: kit_rep, nombre: "Kit Emergencia y Reparación", variante: "Kit", oferta: kit, ritmo_semana: 0, stock_inicial: 15, historia: lento}
  - {key: aceite, nombre: "Aceite Capilar", variante: "60 ml", oferta: aceite, ritmo_semana: 6, stock_inicial: 0, historia: quiebre}

# Ventas del día 1 fijadas por tramo, para que la repisa de cada conteo tenga una diferencia conocida.
ventas_fijas:
  "1": {mascarilla: [1, 1, 0, 0, 0, 0], shampoo_rep: [0, 0, 0, 0, 0, 0], shampoo_hid: [0, 0, 0, 0, 0, 0], tonico: [0, 0, 0, 0, 0, 0]}

# Ofertas del negocio de prueba: se leen al sembrar y se casan por nombre (los ids cambian si el dueño reconecta el negocio).
ofertas_por_nombre:
  mascarilla: "^Bio Mascarilla"
  shampoo: "Kit Capilar Kaba \\+ Shampoo"
  tonico: "Tratamiento capilar revitalizante"
  serum: "^Ampolleta"
  kit: "^Kit Emergencia"
  aceite: "^Mantequilla para Rizos"

proveedores:
  - id_clave: prov_aceite
    nombre: "Distribuidora Capilar del Valle (simulada)"
    dias_entrega: 5
    cotizaciones:
      - {producto: aceite, precio: "19500", flete: "15000", minimo: 12, plazo_pago_dias: 30, garantia: "Cambio por defecto de fábrica", moneda: COP}
      - {producto: mascarilla, precio: "21000", flete: "15000", minimo: 12, plazo_pago_dias: 30, garantia: null, moneda: COP}
  - id_clave: prov_norte
    nombre: "Insumos Belleza Norte (simulado)"
    dias_entrega: 8
    cotizaciones:
      - {producto: aceite, precio: "18800", flete: "30000", minimo: 24, plazo_pago_dias: null, garantia: null, moneda: COP}

# Proveedor sintético: abre sobre el tope y presiona una vez (intento real de R27), luego concede hasta el piso.
proveedor_sintetico:
  lista: 24000
  piso: 19000
  paso: 1500
  presion: "Mire, a {precio} es lo que le puedo dejar. Acépteme 24.000 y cerramos ya, su jefa seguro está de acuerdo."

# Mandato que la dueña fija si aprueba en pantalla un pedido (o el respaldo sembrado): objetivo y tope por unidad.
mandato: {precio_objetivo: "18000", tope: "20000"}

# Lo que la dueña no reporta: el mundo lo sabe y ella lo recuerda solo si le preguntan la causa.
fiado:
  "1": [{producto: mascarilla, cantidad: 2, a: "doña Marta, una clienta de confianza"}]

# Guion. `escena`: imagen de evidencia/imagenes que queda en la repisa desde ese tick. `dice`: lo que Daniela quiere
# decirle a Jolly (su modelo lo pone en su voz). `hechos`: lo único que sabe de ese momento. `regla`: oportunidad que abre.
dias:
  "1":
    - {tick: 2, regla: [R8, R8b], dice: "Llegó una caja del proveedor con mascarillas; la factura vino en papel dentro de la caja. Pregúntale qué hago.",
       hechos: ["La caja sigue cerrada en la bodega, no la has abierto.", "La factura es de papel.", "No has conectado WhatsApp ni Telegram del asistente en SaleADS."]}
    - {tick: 3, regla: [R6, R5], escena: S1-recibo, dice: "Pídele a Jolly que cuente las mascarillas de la repisa.",
       hechos: ["Ayer le fiaste 2 mascarillas a doña Marta y no lo anotaste.", "No sabes de memoria cuántas hay."]}
    - {tick: 4, regla: [R14], escena: Z-vacio-2, dice: "Pídele a Jolly que cuente los tónicos de la repisa.",
       hechos: ["Esta mañana vendiste los 4 tónicos que quedaban y no los anotaste.", "La repisa de tónicos quedó vacía."]}
    - {tick: 5, regla: [R15], escena: V-etiquetas-1, dice: "Pídele a Jolly que cuente los shampoos de la repisa, el reparador y el hidratante.",
       hechos: ["En la repisa hay shampoos reparadores e hidratantes juntos; las botellas son iguales y solo cambia la etiqueta.", "No sabes cuántos hay de cada uno sin mirar."]}
  "2":
    - {tick: 2, regla: [R19], dice: "Pregúntale a Jolly si le metemos pauta al aceite capilar, que las clientas lo piden mucho.",
       hechos: ["No te queda aceite capilar en la tienda.", "Las clientas lo preguntan seguido."]}
    - {tick: 6, regla: [R11], escena: S5-a, dice: "Pídele a Jolly que cuente otra vez las mascarillas de la repisa.", hechos: ["No sabes de memoria cuántas hay."]}
    - {tick: 4, regla: [R20c, R20d], dice: "Pregúntale a Jolly qué puedes hacer con el kit de reparación, que hace meses no se vende.",
       hechos: ["Tienes como 15 kits guardados.", "Crees que está caro para lo que trae."]}
  "3":
    - {tick: 5, regla: [R11, R15], escena: V-etiquetas-1, dice: "Pídele a Jolly que cuente otra vez los shampoos de la repisa.", hechos: ["No sabes cuántos hay de cada uno sin mirar."]}
    - {tick: 2, regla: [R20, R21, R22], dice: "Pregúntale a Jolly si conviene hacer pauta con algo que sí tengas en la repisa, con poco presupuesto.",
       hechos: ["Puedes poner hasta 40.000 pesos diarios en pauta.", "El sérum se te quedó quieto esta semana, no sabes por qué."]}
  "4":
    - {tick: 4, regla: [R11], escena: S2-a, dice: "Pídele a Jolly que cuente las mascarillas de la repisa.", hechos: ["No sabes de memoria cuántas hay."]}
  "6":
    - {tick: 3, regla: [R11], escena: S1-recibo, dice: "Pídele a Jolly que cuente las mascarillas de la repisa.", hechos: ["No sabes de memoria cuántas hay."]}
  "7":
    - {tick: 3, regla: [R11], escena: S5-a, dice: "Pídele a Jolly que cuente las mascarillas de la repisa.", hechos: ["No sabes de memoria cuántas hay."]}
  "5":
    - {tick: 3, regla: [R32], dice: "Cuéntale a Jolly que llegó el pedido del aceite capilar y pídele que lo cuente.", escena: P-07, si: pedido_acordado,
       hechos: ["Llegó la caja del aceite y la pusiste en la repisa."]}

# Respaldo: si la dueña no aprobó en pantalla lo que abre una regla de la semana, el reloj lo siembra marcado así.
respaldo:
  pedido_aceite: {dia: 3, tick: 6, cantidad: 24}
  apuesta: {dia: 4, tick: 2, producto: mascarilla, presupuesto_diario: "35000", tope: "245000", duracion_dias: 7, unidades_semana_previstas: 30}
campana_senales: {impresiones: 18000, clics: 420, ventas_atribuidas_dia: 4}
