# Example only. Requires your own External Secrets store and secret values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: saleads-assistant-secret
  labels:
    app.kubernetes.io/name: sa-assistant-service
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/part-of: saleads-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: saleads-assistant-secret
    creationPolicy: Owner
  data:
    # postgresql://assistant:<pwd>@127.0.0.1:5432/assistant_db (por el sidecar cloud-sql-proxy)
    - secretKey: DATABASE_URL
      remoteRef:
        key: example-project-assistant-DATABASE_URL
    # base64 de 32 bytes: AES-256-GCM de los campos *_enc.
    - secretKey: FIELD_ENCRYPTION_KEY
      remoteRef:
        key: example-project-assistant-FIELD_ENCRYPTION_KEY
    # Project API key de PostHog (lectura de banderas del lado servidor).
    - secretKey: POSTHOG_API_KEY
      remoteRef:
        key: example-project-assistant-POSTHOG_API_KEY
    # Token del consumidor autorizado de las rutas /internal.
    - secretKey: INTERNAL_API_TOKEN
      remoteRef:
        key: example-project-assistant-INTERNAL_API_TOKEN
    # Token de las llamadas autorizadas a servicios internos.
    - secretKey: SALEADS_SERVICES_INTERNAL_TOKEN
      remoteRef:
        key: example-project-common-INTERNAL_API_TOKEN
